<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تقاطع المعرفة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: two score cards on top; a paper crossword grid beside its clue lists on a felt table; gold marks the turn and the chosen word */
:root{
  --felt:#0f2a22;--felt2:#17382d;--felt3:#1f4638;--line:#2f5747;
  --ivory:#f4ecd6;--mute:#a9bdac;--gold:#dcaa45;--gold2:#f3cf7a;--ink:#1b1712;
  --sql:#ecdcb4;--sqd:#a06f43;--wood:#4e3220;--ok:#63c98a;--neon:#4fd8ff;--neonw:#ffffff;--neong:#cfe6ff;--bad:#ec6a55;
  --fd:'Reem Kufi','Noto Kufi Arabic',Tahoma,sans-serif;
  --fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --fc:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --fp:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Arial Unicode MS',sans-serif;
  --bs:max(300px,min(calc(100vh - 300px),46vw,780px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,var(--felt2),var(--felt) 70%) fixed var(--felt);color:var(--ivory);font-family:var(--fb);font-size:17px;line-height:1.6;direction:rtl;display:flex;flex-direction:column;padding-inline:16px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-inline-end:auto}
.brand h1{font-size:1.7rem;color:var(--gold2)}
.brand span{color:var(--mute);font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:transparent;border:1px solid var(--line);color:var(--ivory);border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--felt3);border-color:var(--gold)}
.btn.cur{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:4px 12px;font-size:.88rem}
.btn.arm{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{flex:1;padding-block:20px;min-width:0}
footer{border-top:1px solid var(--line);padding-block:10px;color:var(--mute);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between}
.neon,.neonw{font-weight:700;font-size:inherit;color:var(--neonw);text-shadow:0 0 5px var(--neonw),0 0 12px var(--neonw),0 0 26px var(--neong)}
.neon{font-family:var(--fd)}
footer{align-items:center}
.logo{width:76px;height:76px;flex:none;display:grid;place-items:center;text-align:center;font-size:.7rem;line-height:1.3;color:var(--mute)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.none{border:1px dashed var(--line);border-radius:50%;padding:6px}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.lead{color:var(--mute);max-width:65ch;margin:6px 0 20px}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pagehead h2{font-size:1.6rem}

/* emblem */
.emb{width:44px;height:44px;border-radius:50%;background:var(--tc,var(--gold));color:var(--ink);display:inline-grid;place-items:center;font-family:var(--fp);font-size:22px;flex:none;border:2px solid var(--ivory);overflow:hidden}
.emb img{width:100%;height:100%;object-fit:cover}
.emb.lg{width:84px;height:84px;font-size:42px}
.emb.xl{width:150px;height:150px;font-size:76px;border-width:4px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;align-items:start}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.trow input[type=text]{flex:1 1 200px;min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--felt);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0}
input[type=color]{width:44px;height:38px;padding:2px;background:var(--felt);border:1px solid var(--line);border-radius:6px}
.box{background:var(--felt2);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px}
.box h3{font-size:1.15rem;color:var(--gold2)}
.field{display:grid;gap:4px}
.field label{font-size:.9rem;color:var(--mute)}
.rules{margin:0;padding-inline-start:20px;color:var(--mute);font-size:.93rem}
.rules li{margin-bottom:4px}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:center}
.round{display:grid;gap:16px}
.round>h3{color:var(--gold2);font-size:1.2rem;text-align:center}
.mc{background:var(--felt2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.mc.live{border-color:var(--gold)}
.mt{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem;min-width:0}
.mt span.nm{min-width:0;overflow-wrap:anywhere;flex:1}
.mt.lose{opacity:.45}
.mt .win{color:var(--gold2);font-family:var(--fp)}
.mt.tbd{color:var(--mute);font-weight:400}
.mc small{color:var(--mute)}

/* match */
.mbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.mbar h2{font-size:1.4rem}
.clock{font-family:var(--fd);font-size:clamp(2rem,4vw,3.4rem);font-variant-numeric:tabular-nums;color:var(--gold2);line-height:1;direction:ltr}
.clock.low{color:var(--bad)}
.mctl{display:flex;flex-wrap:wrap;gap:6px}
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"w board b";gap:24px;align-items:center}
.tp{display:grid;justify-items:center;gap:6px;text-align:center;padding:18px 12px;border:2px solid transparent;border-radius:10px;min-width:0}
.tp.w{grid-area:w}.tp.b{grid-area:b}
.tp.on{border-color:var(--gold);background:var(--felt2)}
.tp h3{font-size:clamp(1.3rem,2.2vw,2.2rem);overflow-wrap:anywhere}
.tp .side{color:var(--mute);font-size:.95rem}
.pts{font-family:var(--fd);font-size:clamp(3rem,6vw,5.5rem);line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.pts small{font-size:1rem;color:var(--mute);margin-inline-start:6px;font-family:var(--fb)}
.tp dl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:0;font-size:.9rem;color:var(--mute)}
.tp dl div{display:flex;gap:6px}.tp dd{margin:0;color:var(--ivory);font-weight:600;font-variant-numeric:tabular-nums}
.taken{min-height:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.taken .pc{font-size:1.7rem}
.turn{background:var(--gold);color:var(--ink);font-weight:700;border-radius:20px;padding:2px 16px}
.frame{grid-area:board;background:var(--wood);padding:calc(var(--bs)*.022);border-radius:6px;box-shadow:0 0 0 2px var(--gold),0 18px 40px rgba(0,0,0,.45)}
.board{width:var(--bs);height:var(--bs);max-width:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);direction:ltr}
.sq{position:relative;border:0;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;border-radius:0}
.sq.lt{background:var(--sql)}.sq.dk{background:var(--sqd)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(220,170,69,.38)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(99,201,138,.55)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(236,106,85,.75)}
.sq.tgt::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(27,23,18,.4)}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:calc(var(--bs)*.008) solid rgba(27,23,18,.5)}
.sq i{position:absolute;font-style:normal;font-size:calc(var(--bs)*.02);font-weight:700;color:var(--ink);opacity:.7;font-family:var(--fb)}
.sq.dk i{color:var(--sql);opacity:.9}
.sq .rk{top:3%;left:5%}.sq .fl{bottom:1%;right:6%}
.pc{font-family:var(--fp);line-height:1;font-size:calc(var(--bs)*.098);pointer-events:none}
.pc.w{color:#fffaf0;text-shadow:1px 0 #2a1c10,-1px 0 #2a1c10,0 1px #2a1c10,0 -1px #2a1c10,0 3px 3px rgba(0,0,0,.4)}
.pc.b{color:#1d1915;text-shadow:1px 0 rgba(255,245,220,.6),-1px 0 rgba(255,245,220,.6),0 1px rgba(255,245,220,.6),0 -1px rgba(255,245,220,.6),0 3px 3px rgba(0,0,0,.3)}
.status{text-align:center;font-size:clamp(1.05rem,1.8vw,1.5rem);margin-top:14px;min-height:1.6em}
.status b{color:var(--gold2)}.status .warn{color:var(--bad);font-weight:700}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(8,22,18,.86);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.card{background:var(--felt2);border:2px solid var(--gold);border-radius:12px;padding:clamp(18px,3vw,36px);width:min(1080px,100%);display:grid;gap:18px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:1.1rem}
.qhead .nm{font-family:var(--fd);font-size:1.5rem}
.qtime{margin-inline-start:auto;font-family:var(--fd);font-size:clamp(2.4rem,5vw,4rem);line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.qtime.low{color:var(--bad)}
.badge{border-radius:20px;padding:1px 14px;font-weight:700;font-size:.9rem;color:var(--ink);background:var(--ok);white-space:nowrap}
.badge.l1{background:var(--gold)}.badge.l2{background:var(--bad)}
.cat{color:var(--mute);font-size:.92rem}
.qbar{height:8px;background:var(--felt);border-radius:4px;overflow:hidden;direction:ltr}
.qbar i{display:block;height:100%;background:var(--gold);width:100%}
.lastch{background:var(--bad);color:var(--ink);font-weight:700;text-align:center;border-radius:6px;padding:6px}
.qtext{font-size:clamp(1.5rem,3.4vw,2.8rem);font-family:var(--fc);font-weight:700;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:14px;text-align:start;background:var(--felt);border:2px solid var(--line);border-radius:10px;padding:14px 18px;font-size:clamp(1.15rem,2.3vw,1.9rem);font-weight:600;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--felt3);display:grid;place-items:center;font-family:var(--fd);color:var(--gold2)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.opt.no{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.opt.dim{opacity:.4}
.qres{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:700}
.qres .good{color:var(--ok)}.qres .fail{color:var(--bad)}
.center{text-align:center;justify-items:center}
.big{font-size:clamp(2rem,5vw,4rem);color:var(--gold2)}
.promo{display:flex;gap:12px;justify-content:center;direction:ltr}
.promo button{width:96px;height:96px;background:var(--sql);border:2px solid var(--gold);border-radius:10px;cursor:pointer}
.promo .pc{font-size:64px}
.final{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 48px;font-size:1.3rem}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* bank */
.bform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bform .wide{grid-column:1/-1}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px;align-items:center}
.filters input{flex:1 1 200px}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.bq{min-width:0;flex:1 1 300px}
.bq p{margin:4px 0;font-weight:600}.bq small{color:var(--ok)}
.bact{display:flex;gap:6px}
.empty{color:var(--mute)}

/* champion */
.champ{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:4vh}
.champ .crown{font-family:var(--fp);font-size:clamp(4rem,10vw,8rem);color:var(--gold2);line-height:1}
.champ h2{font-size:clamp(2.4rem,7vw,6rem);color:var(--gold2)}
.champ p{font-size:clamp(1.1rem,2.2vw,1.8rem);margin:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}

/* crossword */
.sbrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;margin-bottom:10px;align-items:stretch}
.mid{display:grid;justify-items:center;align-content:center;padding-inline:8px}.mid small{color:var(--mute)}
.sbn{flex:1;min-width:0;display:grid;gap:2px}
.play+.mctl{margin-top:16px;justify-content:center}
.sb{display:flex;align-items:center;gap:6px 12px;padding:8px 16px;border:2px solid var(--line);border-radius:10px;min-width:0}
.sb.on{border-color:var(--gold);background:var(--felt2)}
.sb h3{overflow-wrap:anywhere;font-size:clamp(1rem,1.7vw,1.6rem)}
.sb .st{color:var(--mute);font-size:.9rem}
.sb .pts{font-size:clamp(2.2rem,4vw,3.6rem);flex:none}.sb .turn{flex:none}
main .status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--felt);margin:0 0 12px;padding-block:6px;border-bottom:1px solid var(--line)}
.play{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.frame{grid-area:auto}
.cw{display:grid;grid-auto-rows:var(--cs);direction:rtl}
.cell{position:relative;border:0;padding:0;margin:0;display:grid;place-items:center;background:var(--sql);color:#000;font-family:var(--fc);font-weight:800;font-size:calc(var(--cs)*.6);line-height:1;cursor:pointer;border-radius:0;box-shadow:inset 0 0 0 1px rgba(27,23,18,.45)}
.cell.blk{background:transparent;box-shadow:none;cursor:default}
.cell.mine{background:color-mix(in srgb,var(--tc) 32%,var(--sql))}
.cell.own{background:color-mix(in srgb,var(--tc) 60%,#fff)}
.cell.hint{color:var(--sqd)}
.cell.sel{box-shadow:inset 0 0 0 calc(var(--cs)*.09) var(--gold),inset 0 0 0 100px rgba(220,170,69,.3)}
.cell .num{position:absolute;top:4%;right:8%;font-style:normal;font-family:var(--fc);font-weight:700;font-size:calc(var(--cs)*.3);opacity:.9}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;min-width:0;max-height:calc(var(--bs)*1.06);overflow-y:auto;align-content:start}
.clues h3{color:var(--gold2);font-size:1.2rem;margin-bottom:6px}
.clue{display:flex;gap:8px;align-items:baseline;width:100%;text-align:start;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;font-family:var(--fc);font-weight:600;font-size:clamp(1rem,1.45vw,1.35rem);color:var(--ivory);min-width:0}
.clue b{flex:none;min-width:1.4em;color:var(--gold2);font-weight:800}
.clue .dir{flex:none;font-style:normal;font-size:.7em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.clue:disabled{cursor:default}
.ccol{border:2px solid transparent;border-radius:8px;padding:6px;min-width:0;align-self:start}
.ccol.on{border-color:var(--tc)}
.ccol:not(.on) .clue:not(.done){opacity:.5}
.ccol h3{display:flex;align-items:center;gap:8px}
.ccol h3 .who{flex:none;width:.8em;height:.8em;border-radius:50%;background:var(--tc)}
.clue span{flex:1;min-width:0;overflow-wrap:anywhere}
.clue em{flex:none;font-style:normal;color:var(--mute);font-size:.85em;white-space:nowrap}
.clue:hover:not(:disabled){border-color:var(--line)}
.clue.sel{border-color:var(--gold);background:var(--felt2)}
.clue.done{cursor:default;opacity:.65}.clue.done span{text-decoration:line-through}.clue.done em{color:var(--ok)}
.clue .who{flex:none;width:.75em;height:.75em;border-radius:50%;background:var(--tc);align-self:center}
.pk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);border-radius:24px;padding:6px 18px;background:transparent;color:var(--ivory);font-size:clamp(1rem,1.6vw,1.35rem);cursor:pointer}
.chip small{color:var(--mute);font-size:.7em}
.chip:hover{border-color:var(--tc)}
.chip.on{background:var(--tc);border-color:var(--tc);color:var(--ink);font-weight:700}.chip.on small{color:var(--ink)}
.mrow{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-inline-start:54px}
.mrow input{font-size:.9rem;padding:5px 10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.mlist{margin:8px 0 0;padding-inline-start:0;list-style:none;display:grid;gap:6px;font-size:.92rem}
.mlist b{color:var(--gold2)}.mlist em{font-style:normal;font-weight:700;color:var(--ok)}
details summary{cursor:pointer;color:var(--gold2)}
.ptbox{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:.8em}
.ptime{font-family:var(--fd);font-size:1.9em;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.ptime.low{color:var(--bad)}
.mbar .clock{font-size:clamp(1.8rem,3.4vw,3rem)}
.pick{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 20px}
.pat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl}
.pat span{width:clamp(36px,5vw,64px);aspect-ratio:1;background:var(--sql);color:#000;display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:clamp(1.3rem,3vw,2.2rem);border-radius:6px}
.pat .slot{width:clamp(36px,5vw,64px);aspect-ratio:1;background:var(--sql);color:var(--ink);border:2px dashed var(--sqd);border-radius:6px;font-family:var(--fc);font-weight:700;font-size:clamp(1.3rem,3vw,2.2rem);cursor:pointer;padding:0}
.pat .slot.full{border-style:solid;border-color:var(--gold)}
.pat .fix{background:var(--felt3);color:var(--ivory)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.tile{width:clamp(46px,6vw,76px);aspect-ratio:1;background:var(--gold);color:var(--ink);border:0;border-radius:10px;font-family:var(--fc);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.6rem);cursor:pointer;box-shadow:0 4px 0 var(--wood);padding:0}
.tile:hover:not(:disabled){background:var(--gold2)}
.tile:disabled{opacity:.25;box-shadow:none;cursor:default}
.ansrow{align-items:center;justify-content:center;display:flex;flex-wrap:wrap;gap:10px}
.ansrow input{flex:1 1 240px;font-size:clamp(1.3rem,2.6vw,2rem);text-align:center;padding:10px}
.bq p{font-family:var(--fd);font-size:1.2rem}.bq small{color:var(--mute)}

@media (max-width:900px){
  :root{--bs:calc(100vw - 32px - 5vw)}
  .arena{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"w b" "board board";gap:12px;justify-items:center}
  .tp{padding:8px;width:100%}.tp dl,.tp .side{display:none}.emb.lg{width:48px;height:48px;font-size:24px}
  .logo{width:52px;height:52px;font-size:.55rem}
  .play,.clues,.sbrow,.pk{grid-template-columns:minmax(0,1fr)}.clues{max-height:none}.play{justify-items:center}
  .setup,.bracket,.opts,.bform{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== وضوح القراءة: خط واحد واضح، أحجام أصغر، ومسافات تفصل الجمل ===== */
:root{--fd:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;--fb:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;--fc:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
body{font-size:15px;line-height:1.8}
h1,h2,h3{line-height:1.6;font-weight:700}
.brand h1{font-size:1.35rem}.brand span{font-size:.85rem}
.pagehead h2{font-size:1.25rem}.lead{font-size:.95rem;line-height:1.9;margin-bottom:16px}
.box h3,.round>h3,.clues h3{font-size:1rem}
.mt{font-size:1rem}.rules{font-size:.88rem;line-height:1.9}.rules li{margin-bottom:6px}
.chips{gap:10px}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:0;font-size:1rem;line-height:1.5;padding:6px 18px;font-weight:600}
.chip small{font-size:.72rem;font-weight:400}
.chip:disabled{opacity:.35;cursor:not-allowed}
.sb{padding:6px 14px}.sb h3{font-size:clamp(.95rem,1.3vw,1.2rem)}.sb .st{font-size:.8rem;line-height:1.6}.sb .pts{font-size:clamp(1.7rem,2.8vw,2.4rem)}
.turn{font-size:.85rem}
.clock,.mbar .clock{font-size:clamp(1.6rem,2.6vw,2.2rem)}
main .status{position:static;background:transparent;font-size:clamp(.95rem,1.2vw,1.1rem);line-height:1.8;border-bottom:0;padding-block:4px}
.ptime{font-size:1.5em}
.clue{font-size:clamp(.88rem,1vw,1rem);font-weight:500;line-height:1.75;padding:7px 8px;border-radius:0;border-bottom:1px solid var(--line);align-items:flex-start;gap:8px}
.clue.sel{border:1px solid var(--gold);border-radius:6px}
.clue em{font-size:.8em;line-height:2.1}.clue .dir{line-height:1.7;margin-top:3px}
.ccol h3{margin-bottom:4px}
.cell{font-size:calc(var(--cs)*.54);font-weight:700}
.qhead{font-size:.95rem}.qhead .nm{font-size:1.15rem;font-weight:700}
.qtime{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.qtext{font-size:clamp(1.15rem,2vw,1.7rem);line-height:1.8;font-weight:700}
.pat span,.pat .slot{width:clamp(34px,4.2vw,54px);font-size:clamp(1.1rem,2.2vw,1.7rem)}
.tile{width:clamp(40px,4.8vw,60px);font-size:clamp(1.2rem,2.4vw,1.9rem);font-weight:700}
.qres{font-size:clamp(1rem,1.5vw,1.25rem)}.big{font-size:clamp(1.5rem,3vw,2.4rem)}.final{font-size:1.05rem}
.champ h2{font-size:clamp(2rem,5vw,3.6rem)}.champ p{font-size:clamp(1rem,1.6vw,1.3rem)}
.mlist{line-height:1.9}
footer{row-gap:8px;line-height:1.8}
.neonw{font-weight:700;font-size:.82rem;font-family:var(--fb)}
.goldtxt{font-family:var(--fb);font-weight:800;font-size:1.2rem;background:linear-gradient(100deg,#9a7418 0%,#f9e79a 22%,#d9a92e 45%,#fff6c2 62%,#c89422 80%,#f3d77a 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 5px rgba(240,200,90,.45));animation:shine 5s linear infinite}
@keyframes shine{to{background-position:220% center}}
@media (prefers-reduced-motion:reduce){.goldtxt{animation:none}}
/* شارة القسم: ميدالية لامعة بإطار ذهبي ورمز حيوان */
.emb{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',var(--fp);font-size:24px}.emb.lg{font-size:46px}.emb.xl{font-size:84px}
.emb{position:relative;overflow:hidden;border:0;color:#fff;font-weight:700;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.65);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.8),rgba(255,255,255,0) 44%),radial-gradient(circle at 50% 62%,var(--tc,var(--gold)),color-mix(in srgb,var(--tc,var(--gold)) 50%,#000));box-shadow:0 0 0 2px #f8e08e,0 0 0 4px #a8801f,0 0 10px 3px rgba(246,214,120,.35),inset 0 -5px 9px rgba(0,0,0,.4);margin:4px;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.emb.lg,.emb.xl{box-shadow:0 0 0 3px #f8e08e,0 0 0 7px #a8801f,0 0 22px 6px rgba(246,214,120,.4),inset 0 -10px 18px rgba(0,0,0,.4)}
.emb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:embshine 4.5s ease-in-out infinite}
@keyframes embshine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.emb::after{animation:none}}
.trow select{min-width:9.5em}
/* أزرار القائمة العلوية: ملوّنة، مجسّمة، لامعة */
#nav{gap:10px;padding-bottom:5px}
#nav .btn{--c:#2f80d0;position:relative;overflow:hidden;border:0;border-radius:11px;padding:7px 17px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 72%,#000) 100%);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 48%,#000),0 8px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s,filter .15s}
#nav .btn::before{content:"";position:absolute;left:4%;right:4%;top:3px;height:44%;border-radius:9px 9px 60% 60%/9px 9px 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.05));pointer-events:none}
#nav .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-130%);pointer-events:none}
#nav .btn:hover{filter:brightness(1.12) saturate(1.1);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 72%,#000) 100%)}
#nav .btn:hover::after{transform:translateX(130%);transition:transform .6s}
#nav .btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 48%,#000),0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
#nav .btn.cur{color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 48%,#000),0 0 0 2px #fff3b0,0 0 14px 3px rgba(246,214,120,.75),inset 0 1px 0 rgba(255,255,255,.7)}
#nav [data-scr=setup]{--c:#2f80d0}
#nav [data-scr=bracket]{--c:#27a560}
#nav [data-scr=models]{--c:#8a5cd6}
#nav [data-scr=bank]{--c:#e2812a}
#nav [data-scr=match]{--c:#d9a52b;color:#2a1c05;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#nav [data-act=mute]{--c:#d84f57}
#nav [data-act=full]{--c:#1fa3a8}
@media (prefers-reduced-motion:reduce){#nav .btn,#nav .btn::after{transition:none}}
/* ===== الخلفية الفاتحة: تنسيق الألوان لتلائم الأبيض ===== */
[data-light="1"] body{background:radial-gradient(120% 80% at 50% 0%,#ffffff,var(--felt) 60%,var(--felt2)) fixed var(--felt)}
[data-light="1"] #top{border-bottom:2px solid var(--gold)}
[data-light="1"] footer{border-top:2px solid var(--gold)}
[data-light="1"] .neonw,[data-light="1"] .neon{text-shadow:none}
[data-light="1"] .goldtxt{background-image:linear-gradient(100deg,#7a5200 0%,#d4a12a 22%,#8c5f00 45%,#e6b93e 62%,#6f4a00 80%,#c08f1c 100%);filter:drop-shadow(0 1px 1px rgba(120,80,0,.25))}
[data-light="1"] .veil{background:rgba(20,38,31,.6)}
[data-light="1"] .box,[data-light="1"] .mc,[data-light="1"] .sb{box-shadow:0 2px 10px rgba(18,58,46,.08)}
[data-light="1"] .card{box-shadow:0 20px 50px rgba(0,0,0,.35)}
[data-light="1"] .brand h1,[data-light="1"] .pagehead h2{color:#0f3d2e}
[data-light="1"] .box h3,[data-light="1"] .round>h3,[data-light="1"] .ccol h3{color:#0f5a41}
[data-light="1"] .clock,[data-light="1"] .pts,[data-light="1"] .ptime,[data-light="1"] .qtime{color:#b47a00}
[data-light="1"] .clue b,[data-light="1"] .status b{color:#0f5a41}
[data-light="1"] .btn:not(.gold):hover{background:var(--felt3)}
[data-light="1"] .chip{background:#fff}
[data-light="1"] input[type=text],[data-light="1"] input[type=number],[data-light="1"] input[type=search],[data-light="1"] select,[data-light="1"] textarea{background:#fff}
[data-light="1"] .mt .win{color:#b47a00}
[data-light="1"] .sw{border-color:#9aa9a1}
/* ===== الشعاران: لامعان ومائلان بتأثير ثلاثي الأبعاد ===== */
.logo{width:86px;height:86px;perspective:420px;position:relative}
.logo img{border-radius:50%;background:#fff;transform:rotateY(-22deg) rotateX(8deg);transform-style:preserve-3d;box-shadow:0 0 0 2px #f8e08e,0 0 0 5px #a8801f,10px 12px 18px rgba(0,0,0,.4),0 0 16px 3px rgba(246,214,120,.45);animation:logosway 6s ease-in-out infinite}
#lg-uni img{transform:rotateY(22deg) rotateX(8deg);box-shadow:0 0 0 2px #f8e08e,0 0 0 5px #a8801f,-10px 12px 18px rgba(0,0,0,.4),0 0 16px 3px rgba(246,214,120,.45);animation-name:logosway2}
.logo:not(.none)::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 48%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:130% 0;animation:logoshine 5s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes logosway{0%,100%{transform:rotateY(-24deg) rotateX(8deg)}50%{transform:rotateY(-8deg) rotateX(3deg)}}
@keyframes logosway2{0%,100%{transform:rotateY(24deg) rotateX(8deg)}50%{transform:rotateY(8deg) rotateX(3deg)}}
@keyframes logoshine{0%,55%{background-position:130% 0}100%{background-position:-60% 0}}
#top{padding-inline:10px;gap:8px 22px}
@media (max-width:900px){.logo{width:56px;height:56px}}

const norm=s=>String(s).replace(/[\u064B-\u0652\u0670\u0640\s]/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function canPlace(g,N,a,r,c,d){const dr=d,dc=1-d,L=a.length,er=r+dr*(L-1),ec=c+dc*(L-1);
  if(r<0||c<0||er>=N||ec>=N)return -1;
  const at=(y,x)=>y>=0&&x>=0&&y<N&&x<N?g[y][x]:null;
  if(at(r-dr,c-dc)||at(er+dr,ec+dc))return -1;let k=0;
  for(let i=0;i<L;i++){const y=r+dr*i,x=c+dc*i,cell=g[y][x];
    if(cell){if(cell.ch!==a[i]||cell[d?'dn':'ac'])return -1;k++}
    else if(at(y+dc,x+dr)||at(y-dc,x-dr))return -1}
  return k}
function putWord(g,a,r,c,d){for(let i=0;i<a.length;i++){const y=r+d*i,x=c+(1-d)*i,cell=g[y][x]||(g[y][x]={ch:a[i],ac:false,dn:false});cell[d?'dn':'ac']=true}}
/* words: [{id,a,clue,cat}] → {R,C,words:[{...,r,c,d,num}]} */
function buildPuzzle(words,target,quota,N=15){let best=null,bestSc=-1,bestCnt=[0,0];
  for(let t=0;t<80;t++){const g=Array.from({length:N},()=>Array(N).fill(null)),placed=[],cnt=[0,0];
    let list=shuffle(words).map(w=>({w,k:w.a.length+Math.random()*3})).sort((x,y)=>y.k-x.k).map(x=>x.w);
    for(let pass=0;pass<2&&placed.length<target;pass++){const rest=[];
      for(const w of list){if(placed.length>=target)break;if(quota&&cnt[w.o]>=quota)continue;
        if(!placed.length){const r=N>>1,c=(N-w.a.length)>>1;putWord(g,w.a,r,c,0);placed.push({...w,r,c,d:0});cnt[w.o|0]++;continue}
        const opts=[];
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){const cell=g[y][x];if(!cell)continue;
          for(let i=0;i<w.a.length;i++){if(w.a[i]!==cell.ch)continue;
            if(!cell.ac){const k=canPlace(g,N,w.a,y,x-i,0);if(k>0)opts.push([k,y,x-i,0])}
            if(!cell.dn){const k=canPlace(g,N,w.a,y-i,x,1);if(k>0)opts.push([k,y-i,x,1])}}}
        if(!opts.length){rest.push(w);continue}
        const mx=Math.max(...opts.map(o=>o[0])),top=opts.filter(o=>o[0]===mx),o=top[Math.random()*top.length|0];
        putWord(g,w.a,o[1],o[2],o[3]);placed.push({...w,r:o[1],c:o[2],d:o[3]});cnt[w.o|0]++}
      list=rest}
    const sc=quota?Math.min(cnt[0],cnt[1])*100+placed.length:placed.length;if(sc>bestSc){bestSc=sc;best=placed;bestCnt=cnt}
    if(best.length>=target)break}
  const r0=Math.min(...best.map(w=>w.r)),c0=Math.min(...best.map(w=>w.c));
  const R=Math.max(...best.map(w=>w.r+w.d*(w.a.length-1)))-r0+1,C=Math.max(...best.map(w=>w.c+(1-w.d)*(w.a.length-1)))-c0+1;
  best.forEach(w=>{w.r-=r0;w.c-=c0});
  let n=0;const nums={};
  best.slice().sort((x,y)=>x.r-y.r||x.c-y.c).forEach(w=>{const k=w.r+','+w.c;w.num=nums[k]||(nums[k]=++n)});
  return{R,C,words:best,cnt:bestCnt}}
const cellsOf=w=>Array.from({length:w.a.length},(_,i)=>[w.r+w.d*i,w.c+(1-w.d)*i]);

const RN=i=>i<4?'ربع النهائي':i<6?'نصف النهائي':'النهائي';
const fresh=()=>({scr:'setup',mute:false,cfg:{qTime:30,pickTime:20,mTime:10,k:10,minLv:2,rot:true},br:null,models:{},cur:null,used:[],ws:null,logos:{col:'',uni:''},bg:'#ffffff',
  teams:[['إدارة الأعمال','#e0694f'],['المحاسبة','#4f9bd9'],['الاقتصاد','#e2b33d'],['العلوم المالية والمصرفية','#63b77e'],['الإدارة الصناعية','#ab7fd9'],['نظم المعلومات الإدارية','#e88f44'],['إدارة التسويق','#46b9b3']].map(([name,color],i)=>({name,color,sym:SYMS[i],m:['','','']}))});
let S=fresh();
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.teams)&&d.teams.length===7)S=Object.assign(S,d)}catch(e){}
if(S.bgw!==1){S.bgw=1;if(S.bg==='#0f2a22')S.bg='#ffffff'}
S.teams.forEach((t,i)=>{if(!SYMS.includes(t.sym)||S.teams.findIndex(x=>x.sym===t.sym)<i)t.sym=SYMS.find(g=>!S.teams.some(x=>x.sym===g))});
const U={pl:0,fl:'',pk:null,sel:null,q:null,paused:false,edit:null,fc:'',fs:''};U.pl=S.cfg.pickTime;
const nL=n=>n===2?'حرفان':n<=10?n+' أحرف':n+' حرفاً';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const bank=()=>S.ws||DEFW;
const fmt=t=>{t=Math.max(0,Math.ceil(t));return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const emb=(t,c='')=>t?`<span class="emb ${c}" style="--tc:${esc(t.color)}">${esc(t.sym)}</span>`:`<span class="emb ${c}" style="--tc:var(--line)">؟</span>`;
const BGS=[['#ffffff','أبيض'],['#0f2a22','أخضر'],['#0f1f3a','كحلي'],['#3a0f1c','عنابي'],['#26143d','بنفسجي'],['#2e1c10','بني'],['#17191c','فحمي'],['#f2ead8','عاجي فاتح']];
function applyBg(){const c=/^#[0-9a-f]{6}$/i.test(S.bg)?S.bg:'#ffffff',n=parseInt(c.slice(1),16),lum=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255,light=lum>.55,k=light?'#123a2e':'white',st=document.documentElement.style;
  const m=light?[96,90,80]:[93,84,72];
  const set={'--felt':c,'--felt2':`color-mix(in srgb,${c} ${m[0]}%,${k})`,'--felt3':`color-mix(in srgb,${c} ${m[1]}%,${k})`,'--line':`color-mix(in srgb,${c} ${m[2]}%,${k})`,
    '--ivory':light?'#04100b':'#f4ecd6','--mute':light?'#2b3a33':`color-mix(in srgb,${c} 30%,white)`,'--gold2':light?'#7a5000':'#f3cf7a','--gold':light?'#e0ae3e':'#dcaa45','--neon':light?'#0070d6':'#4fd8ff','--neonw':light?'#04100b':'#ffffff','--neong':light?'transparent':'#cfe6ff','color-scheme':light?'light':'dark'};
  for(const k2 in set)st.setProperty(k2,set[k2]);document.documentElement.dataset.light=light?'1':'0'}

/* ===== الصوت ===== */
let AC;
function tone(f,d,t='sine',w=0,v=.12){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const SND={tap:()=>tone(520,.05,'triangle'),ask:()=>tone(440,.15,'triangle'),tick:()=>tone(1000,.04,'square',0,.05),
  ok:()=>{tone(660,.12);tone(880,.22,'sine',.12)},bad:()=>{tone(200,.25,'sawtooth',0,.08);tone(140,.35,'sawtooth',.2,.08)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',i*.15))};
const snd=n=>SND[n]();

/* ===== البطولة ===== */
const ALLC=()=>Object.keys(CATS),stageOf=i=>i<4?0:i<6?1:2,MIDX=[0,1,2,4,5,6];
function drawLots(){const o=shuffle([0,1,2,3,4,5,6]);
  S.br=[{a:o[0],b:o[1]},{a:o[2],b:o[3]},{a:o[4],b:o[5]},{a:o[6],b:null,w:o[6],bye:true},{},{},{}];
  S.cur=null;S.used=[];S.models={};advance()}
function advance(){const B=S.br,w=i=>B[i].w??null;[[4,0,1],[5,2,3],[6,4,5]].forEach(([t,x,y])=>{B[t].a=w(x);B[t].b=w(y)})}
const bankN=()=>bank().map(x=>({id:x.id,w:x.w,a:norm(x.w),clue:x.q,cat:x.c,l:x.l||2})).filter(x=>x.a.length>=2&&x.a.length<=10);
const freshN=cat=>bankN().filter(x=>x.cat===cat&&x.l>=S.cfg.minLv&&!S.used.includes(x.id)).length;
/* مرشّحو موضوع واحد: الجديد بالمستوى المطلوب أولاً، ثم الجديد الأسهل، ثم المستعمل سابقاً عند الضرورة */
function candFor(cat,n,excl,stage){const seen={},all=bankN().filter(x=>x.cat===cat&&x.l>=S.cfg.minLv&&!S.used.includes(x.id)&&!excl.includes(x.a)&&!seen[x.a]&&(seen[x.a]=1));
  return shuffle(all).sort((x,y)=>stage===2?y.l-x.l:stage===0?x.l-y.l:0).slice(0,n)}
/* شبكة المباراة: عدد متساوٍ لكل فريق، كل فريق من موضوعه فقط، ومن كلمات لم تُستعمل في أي جولة سابقة */
function makeDuel(cA,cB,stage){const k=S.cfg.k,n=Math.round(k*2.4);let A,B;
  if(cA===cB){const all=candFor(cA,n*2,[],stage);A=all.filter((x,i)=>i%2===0);B=all.filter((x,i)=>i%2===1)}
  else{A=candFor(cA,n,[],stage);B=candFor(cB,n,A.map(x=>x.a),stage)}
  A.forEach(x=>x.o=0);B.forEach(x=>x.o=1);
  for(let kk=Math.min(k,A.length,B.length);kk>=3;kk--)for(const N of[13,14,15])for(let t=0;t<2;t++){const pz=buildPuzzle(A.concat(B),2*kk,kk,N);
    if(pz.cnt[0]===kk&&pz.cnt[1]===kk){pz.words.forEach(w=>S.used.push(w.id));return{R:pz.R,C:pz.C,words:pz.words,cats:[cA,cB],k:kk}}}
  return null}
function startMatch(i){if(S.cur&&S.cur.i!==i)return;
  if(S.cur){U.sel=null;U.q=null;U.paused=false;S.scr='match'}else{U.pk={i,sel:[null,null],msg:''};S.scr='pick'}
  save();render()}
function beginMatch(){const P=U.pk,[cA,cB]=P.sel;if(!cA||!cB)return;const m=S.br[P.i],md=makeDuel(cA,cB,stageOf(P.i));
  if(!md){P.msg='الكلمات الجديدة في الموضوعين المختارين لا تكفي لبناء شبكة. اختارا موضوعاً آخر.';render();return}
  S.models[P.i]=md;const z=()=>({pts:0,ok:0,bad:0});
  const note=md.k<S.cfg.k?`الشبكة فيها ${md.k} كلمات لكل فريق. `:'';
  S.cur={i:P.i,t:[m.a,m.b],cats:md.cats,turn:0,R:md.R,C:md.C,words:md.words.map(w=>({...w,by:null,fails:0})),rev:[],sc:[z(),z()],mi:[0,0],life:[1,1],left:S.cfg.mTime*60,undo:[],over:null,note};
  U.pk=null;U.sel=null;U.q=null;U.paused=false;U.pl=S.cfg.pickTime;S.scr='match';save();render()}

/* ===== سير المباراة ===== */
const tn=k=>esc(S.teams[S.cur.t[k]].name);
/* خريطة الخانات الظاهرة: المفتاح "r,c" والقيمة رقم الفريق أو -1 للحرف المكشوف */
function visMap(M){const v={};M.words.forEach(w=>{if(w.by!=null&&w.by>=0)cellsOf(w).forEach(([r,c])=>{const k=r+','+c;if(!(k in v))v[k]=w.by})});
  M.rev.forEach(k=>{if(!(k in v))v[k]=-1});
  M.words.forEach(w=>{if(w.by===-1)cellsOf(w).forEach(([r,c])=>{const k=r+','+c;if(!(k in v))v[k]=-1})});return v}
const hiddenOf=(w,v)=>cellsOf(w).filter(([r,c])=>!((r+','+c)in v));
function sweep(M){let ch=true;while(ch){ch=false;const v=visMap(M);M.words.forEach(w=>{if(w.by==null&&!hiddenOf(w,v).length){w.by=-1;ch=true}})}}
function clickCell(r,c){const M=S.cur;if(!M||M.over||U.q||U.paused)return;
  const ws=M.words.filter(w=>w.by==null&&w.o===M.turn&&cellsOf(w).some(([y,x])=>y===r&&x===c));if(!ws.length)return;
  ws.sort((a,b)=>a.d-b.d);U.sel=ws.length>1&&U.sel===ws[0].id?ws[1].id:ws[0].id;snd('tap');render()}
function ask(){const M=S.cur,w=M.words.find(x=>x.id===U.sel);if(!w||w.by!=null||U.q)return;
  const v=visMap(M),fix=cellsOf(w).map(([r,c],i)=>(r+','+c)in v?w.a[i]:null),need=[...w.a].filter((ch,i)=>!fix[i]),AB='ابتثجحخدذرزسشصضطظعغفقكلمنهويةأىإ';
  const decoy=Array.from({length:Math.max(4,10-need.length)},()=>AB[Math.random()*AB.length|0]);
  U.q={id:w.id,left:S.cfg.qTime,done:false,ok:false,typed:'',sec:-1,gain:0,fix,fill:fix.map(()=>null),tiles:shuffle(need.concat(decoy))};snd('ask');render()}
const qWord=Q=>Q.fix.map((f,i)=>f||(Q.fill[i]!=null?Q.tiles[Q.fill[i]]:'')).join('');
const qFull=Q=>Q.fix.every((f,i)=>f||Q.fill[i]!=null);
function tileClick(k){const Q=U.q;if(!Q||Q.done||U.paused||Q.fill.includes(k))return;const i=Q.fix.findIndex((f,j)=>!f&&Q.fill[j]==null);if(i<0)return;Q.fill[i]=k;snd('tap');render()}
function slotClick(i){const Q=U.q;if(!Q||Q.done||U.paused||Q.fill[i]==null)return;Q.fill[i]=null;render()}
function answer(val){const Q=U.q;if(!Q||Q.done||U.paused)return;const M=S.cur,w=M.words.find(x=>x.id===Q.id);
  Q.done=true;Q.typed=val==null?null:val.trim();Q.ok=val!=null&&norm(val)===w.a;Q.gain=hiddenOf(w,visMap(M)).length;snd(Q.ok?'ok':'bad');render();const b=$('#contbtn');if(b)b.focus()}
function cont(){const Q=U.q;if(!Q||!Q.done)return;U.q=null;resolve(Q.id,Q.ok)}
function pushUndo(){const M=S.cur,{undo,...rest}=M;undo.push(JSON.stringify(rest));if(undo.length>40)undo.shift()}
function undoMove(){const M=S.cur;if(!M||U.q||!M.undo.length)return;S.cur={...JSON.parse(M.undo.pop()),undo:M.undo,left:M.left};U.sel=null;U.pl=S.cfg.pickTime;save();render()}
function resolve(id,ok){const M=S.cur,side=M.turn,w=M.words.find(x=>x.id===id),sc=M.sc[side];pushUndo();
  if(ok){sc.pts+=hiddenOf(w,visMap(M)).length;sc.ok++;w.by=side;M.note=''}
  else{sc.bad++;w.fails++;const h=hiddenOf(w,visMap(M));if(h.length){const p=h[Math.random()*h.length|0];M.rev.push(p[0]+','+p[1])}
    M.note=`أخطأ قسم ${tn(side)}، فكُشف حرف من الكلمة.`}
  endTurn()}
function passTurn(msg){const M=S.cur;if(!M||M.over||U.q)return;pushUndo();M.note=msg||`تخطّى قسم ${tn(M.turn)} دوره.`;endTurn()}
function lifeline(){const M=S.cur,w=M&&M.words.find(x=>x.id===U.sel);if(!w||M.over||U.q||!M.life[M.turn])return;const h=hiddenOf(w,visMap(M));if(h.length<2)return;
  pushUndo();const p=h[Math.random()*h.length|0];M.rev.push(p[0]+','+p[1]);M.life[M.turn]=0;sweep(M);snd('tap');save();render()}
function endTurn(){const M=S.cur;sweep(M);M.mi[M.turn]=(M.mi[M.turn]+1)%3;M.turn=1-M.turn;U.sel=null;U.pl=S.cfg.pickTime;
  if(!M.words.some(w=>w.by==null&&w.o===M.turn)&&M.words.some(w=>w.by==null))M.turn=1-M.turn;
  if(M.words.every(w=>w.by!=null))decide('اكتملت الشبكة');else if(S.cfg.mTime>0&&M.left<=0)decide('انتهى وقت الجولة');save();render()}
function decide(reason){const M=S.cur,[a,b]=M.sc;
  if(a.pts!==b.pts)M.over={win:a.pts>b.pts?0:1,reason:reason+'. الحسم بمجموع النقاط'};
  else if(a.bad!==b.bad)M.over={win:a.bad<b.bad?0:1,reason:reason+'. تساوت النقاط، والحسم بأقل عدد من الإجابات الخاطئة'};
  else M.over={tie:true,reason:reason+'. تساوى القسمان في كل شيء'};
  snd('win')}
function commit(side){const M=S.cur;if(!M||!M.over)return;const s=side!=null&&side!==''?+side:M.over.win;S.br[M.i].w=M.t[s];S.br[M.i].how=M.over.reason;advance();
  const fin=M.i===6;S.cur=null;S.scr=fin?'champ':'bracket';save();render();if(fin)confetti()}

/* ===== المؤقّت ===== */
let lastT=performance.now(),lastSave=0;
setInterval(()=>{const now=performance.now(),dt=Math.min(1,(now-lastT)/1000);lastT=now;const M=S.cur,Q=U.q;
  if(S.scr!=='match'||!M||M.over||U.paused)return;
  if(S.cfg.mTime>0)M.left=Math.max(0,M.left-dt);
  if(Q&&!Q.done){Q.left-=dt;const s=Math.ceil(Q.left);if(Q.left<=0){Q.left=0;answer(null)}else if(s<=5&&s!==Q.sec){Q.sec=s;snd('tick')}}
  else if(!Q&&S.cfg.pickTime>0){U.pl-=dt;if(U.pl<=0){snd('bad');passTurn(`انتهى وقت الاختيار على قسم ${tn(M.turn)}.`);return}}
  paint();
  if(S.cfg.mTime>0&&M.left<=0&&!U.q){U.sel=null;decide('انتهى وقت الجولة');save();render()}
  if(now-lastSave>5000){lastSave=now;save()}},200);
function paint(){const M=S.cur,c=$('#mclock');if(c&&M){c.textContent=fmt(M.left);c.classList.toggle('low',M.left<=60)}
  const pt=$('#ptime');if(pt){pt.textContent=Math.max(0,Math.ceil(U.pl));pt.classList.toggle('low',U.pl<=5)}
  const Q=U.q,t=$('#qtime');if(Q&&t){t.textContent=Math.ceil(Q.left);t.classList.toggle('low',Q.left<=5);$('#qfill').style.width=(100*Q.left/S.cfg.qTime)+'%'}}

/* ===== العرض ===== */
function render(){document.documentElement.dir='rtl';document.documentElement.lang='ar';
  $('#nav').innerHTML=[['setup','الإعداد'],['bracket','شجرة البطولة'],['models','النماذج'],['bank','بنك الكلمات']].map(([k,t])=>`<button class="btn sm ${S.scr===k?'cur':''}" data-act="go" data-scr="${k}">${t}</button>`).join('')+
    (S.cur&&S.scr!=='match'?`<button class="btn sm gold" data-act="go" data-scr="match">العودة إلى المباراة</button>`:'')+
    `<button class="btn sm" data-act="mute">${S.mute?'تشغيل الصوت':'كتم الصوت'}</button><button class="btn sm" data-act="full">ملء الشاشة</button>`;
  [['col','شعار الكلية'],['uni','شعار الجامعة']].forEach(([k,t])=>{const el=$('#lg-'+k),v=S.logos[k]||DEFLOGO[k];el.classList.toggle('none',!v);el.innerHTML=v?`<img src="${esc(v)}" alt="${t}">`:t});
  applyBg();
  if(S.scr==='pick'&&(!U.pk||!S.br||S.cur))S.scr='bracket';
  if(S.scr==='match'&&!S.cur)S.scr='bracket';
  if((S.scr==='bracket'||S.scr==='champ')&&!S.br)S.scr='setup';
  $('#app').innerHTML={setup:vSetup,bracket:vBracket,models:vModels,pick:vPick,match:vMatch,bank:vBank,champ:vChamp}[S.scr]();
  if(S.scr==='match')paint()}

<h3>قواعد اللعب</h3><ul class="rules"><li>قبل كل مباراة يختار كل قسم موضوعاً واحداً من خمسة: فن وأدب، رياضة، معلومات عامة، تاريخ وجغرافية، ألغاز وأحاجي.</li><li>لا تتكرر أي كلمة أو سؤال في البطولة كلها.</li><li>تُبنى شبكة فيها عدد متساوٍ من الكلمات لكل قسم، وكل قسم كلماته من موضوعه فقط.</li><li>لا يجيب القسم إلا عن كلماته، وهي مميّزة بلونه.</li><li>للقسم وقت محدد لاختيار كلمة، ثم وقت للإجابة. انتهاء وقت الاختيار يُفقد الدور.</li><li>تُركَّب الإجابة باختيار الحروف من لوحة حروف ظاهرة، وفيها حروف زائدة للتمويه.</li><li>الإجابة الصحيحة: نقطة عن كل حرف كان مخفياً في الكلمة.</li><li>الإجابة الخاطئة أو انتهاء الوقت: يُكشف حرف من الكلمة وينتقل الدور.</li><li>لكل فريق مساعدة واحدة في الجولة: كشف حرف من الكلمة المختارة.</li><li>تنتهي الجولة باكتمال الشبكة أو بانتهاء مدتها، ويفوز صاحب النقاط الأعلى.</li></ul></div></div>`}

function vBracket(){const B=S.br,T=S.teams;
  const row=(m,k)=>{const t=m[k];if(t==null)return `<div class="mt tbd">${emb(null)}<span class="nm">${m.bye?'بلا منافس':'بانتظار الفائز'}</span></div>`;
    return `<div class="mt ${m.w!=null&&m.w!==t?'lose':''}">${emb(T[t])}<span class="nm">${esc(T[t].name)}</span>${m.w===t?'<span class="win">★</span>':''}</div>`};
  const card=i=>{const m=B[i],live=S.cur&&S.cur.i===i,ready=m.a!=null&&m.b!=null&&m.w==null;
    return `<div class="mc ${live?'live':''}">${row(m,'a')}${row(m,'b')}${m.bye?'<small>تأهّل مباشرة بالقرعة</small>':m.w!=null?`<small>${esc(m.how||'')}</small>`:ready?`<button class="btn ${live?'gold':''} sm" data-act="start" data-i="${i}" ${S.cur&&!live?'disabled':''}>${live?'متابعة المباراة':'ابدأ المباراة'}</button>`:''}</div>`};
  return `<div class="pagehead"><h2>شجرة البطولة</h2>${B[6].w!=null?`<button class="btn gold" data-act="go" data-scr="champ">شاشة التتويج</button>`:''}</div>
<p class="lead">ابدأ المباريات بالترتيب. يتأهل الفائز تلقائياً إلى الدور التالي.</p>
<div class="bracket"><div class="round"><h3>ربع النهائي</h3>${[0,1,2,3].map(card).join('')}</div><div class="round"><h3>نصف النهائي</h3>${[4,5].map(card).join('')}</div><div class="round"><h3>النهائي</h3>${card(6)}</div></div>`}

function vModels(){if(!S.br)return `<div class="pagehead"><h2>نماذج الجولات</h2></div><p class="lead">أجرِ القرعة أولاً من شاشة «الإعداد».</p>`;
  const T=S.teams,card=(i,n)=>{const md=S.models[i],m=S.br[i],live=S.cur&&S.cur.i===i,done=m.w!=null,nm=k=>m[k]!=null?esc(T[m[k]].name):'بانتظار الفائز';
    if(!md)return `<div class="box"><h3>النموذج ${n} · ${RN(i)}</h3><div class="cat">${nm('a')} × ${nm('b')}</div><p class="empty">يُبنى بعد أن يختار القسمان موضوعيهما.</p></div>`;
    const sec=o=>`<h3>${nm(o?'b':'a')} · ${CATS[md.cats[o]]||''}</h3><ol class="mlist">${md.words.filter(w=>w.o===o).sort((a,b)=>a.num-b.num).map(w=>`<li><b>${w.num} ${w.d?'عمودي':'أفقي'}</b> ${esc(w.clue)} <em>${esc(w.w||w.a)}</em> <span class="cat">${LV[w.l||2]}</span></li>`).join('')}</ol>`;
    return `<div class="box"><h3>النموذج ${n} · ${RN(i)}</h3><div class="cat">${done?'انتهت':live?'جارية الآن':'لم تبدأ'} · ${md.k} كلمات لكل فريق</div><details><summary>عرض الكلمات والإجابات</summary>${sec(0)}${sec(1)}</details></div>`};
  return `<div class="pagehead"><h2>نماذج الجولات</h2></div><p class="lead">هذه الشاشة للجنة المنظِّمة فقط، ففيها الإجابات. لا تفتحها أمام المتسابقين. يُبنى نموذج كل جولة عند اختيار القسمين لموضوعيهما.</p><div class="mgrid">${MIDX.map((i,n)=>card(i,n+1)).join('')}</div>`}

function vPick(){const P=U.pk,m=S.br[P.i],k=S.cfg.k;
  const colm=o=>{const t=S.teams[o?m.b:m.a];return `<div class="box" style="--tc:${esc(t.color)}"><div class="mt">${emb(t)}<span class="nm">${esc(t.name)}</span></div><div class="chips">${Object.entries(CATS).map(([c,n])=>{const f=freshN(c),need=P.sel[1-o]===c?2*k:k,off=f<need&&P.sel[o]!==c;return `<button class="chip ${P.sel[o]===c?'on':''}" data-act="pk" data-k="${o}" data-c="${c}" aria-pressed="${P.sel[o]===c}" ${off?'disabled':''}>${n}<small>${off?'انتهت كلماته':'بقي '+f+' كلمة'}</small></button>`}).join('')}</div><div class="cat">${P.sel[o]?'الموضوع المختار: '+CATS[P.sel[o]]:'لم يُختر موضوع بعد'}</div></div>`};

<p class="lead">يختار كل قسم موضوعاً واحداً. تُبنى الشبكة من ${k} كلمات لكل قسم، وكلمات كل قسم من موضوعه فقط. لا تتكرر أي كلمة في البطولة، والموضوع الذي تنتهي كلماته يُقفل.</p>
<div class="pk">${colm(0)}${colm(1)}</div>
<p class="status">${P.msg?`<span class="warn">${P.msg}</span>`:''}</p>`}

function vMatch(){const M=S.cur,v=visMap(M),T=k=>S.teams[M.t[k]],sel=M.words.find(w=>w.id===U.sel),g={};
  M.words.forEach(w=>cellsOf(w).forEach(([r,c],i)=>{const k=r+','+c,o=g[k]||(g[k]={ch:w.a[i],ow:w.o});if(o.ow!==w.o)o.ow=-1;if(i===0)o.num=w.num;if(sel&&w.id===sel.id)o.sel=true}));
  let bd='';for(let r=0;r<M.R;r++)for(let c=0;c<M.C;c++){const k=r+','+c,o=g[k];if(!o){bd+='<div class="cell blk"></div>';continue}
    const own=v[k],tc=own>=0?own:o.ow;bd+=`<button class="cell ${o.sel?'sel':''} ${own>=0?'own':own===-1?'hint':''} ${own==null&&o.ow>=0?'mine':''}" ${tc>=0?`style="--tc:${esc(T(tc).color)}"`:''} data-r="${r}" data-c="${c}">${o.num?`<i class="num">${o.num}</i>`:''}${k in v?o.ch:''}</button>`}
  const mem=k=>{const t=T(k),i=M.mi[k]%3;return esc((t.m||[])[i]||'الطالب '+(i+1))};
  const sb=k=>{const t=T(k),sc=M.sc[k],on=!M.over&&M.turn===k;return `<div class="sb ${on?'on':''}">${emb(t)}<div class="sbn"><h3>${esc(t.name)}</h3><span class="st">${S.cfg.rot?'المجيب: '+mem(k)+' · ':''}صحيحة ${sc.ok} · خاطئة ${sc.bad} · المساعدة ${M.life[k]?'متاحة':'استُخدمت'}</span></div>${on?'<span class="turn">الدور الآن</span>':''}<span class="pts">${sc.pts}</span></div>`};
  const list=o=>M.words.filter(w=>w.o===o).sort((a,b)=>a.num-b.num||a.d-b.d).map(w=>`<button class="clue ${sel&&sel.id===w.id?'sel':''} ${w.by!=null?'done':''}" data-act="pick" data-id="${w.id}" ${w.by!=null||M.turn!==o?'disabled':''}><b>${w.num}</b><i class="dir">${w.d?'عمودي':'أفقي'}</i><span>${esc(w.clue)}</span><em>${w.by!=null?w.a+(w.by>=0?'':' · كُشفت'):nL(w.a.length)}</em></button>`).join('');
  const col=o=>`<div class="ccol ${!M.over&&M.turn===o?'on':''}" style="--tc:${esc(T(o).color)}"><h3><i class="who"></i>${esc(T(o).name)} · ${CATS[M.cats[o]]||''}</h3>${list(o)}</div>`;
  const left=M.words.filter(w=>w.by==null&&w.o===M.turn).length;
  const ptm=S.cfg.pickTime>0?`<span class="ptbox">وقت الاختيار <b class="ptime" id="ptime">${Math.max(0,Math.ceil(U.pl))}</b></span>`:'';
  let st='';if(!M.over)st=`<div class="pick">${ptm}`+(sel?`<span><b>${sel.num} ${sel.d?'عمودي':'أفقي'}:</b> ${esc(sel.clue)}</span><button class="btn gold" data-act="ask">بدء الإجابة</button>${M.life[M.turn]&&hiddenOf(sel,v).length>1?`<button class="btn" data-act="life">مساعدة: كشف حرف</button>`:''}`
    :`<span>${M.note?esc(M.note)+' ':''}دور قسم <b>${tn(M.turn)}</b>: اختر كلمة من كلماتك في موضوع «${CATS[M.cats[M.turn]]||''}». بقي لك ${left}.</span>`)+'</div>';
  let ov='';
  if(U.paused)ov=`<div class="veil"><div class="card center"><h2 class="big">المباراة متوقفة مؤقتاً</h2><button class="btn gold" data-act="pause">استئناف</button></div></div>`;
  else if(M.over){const o=M.over,sum=`<div class="final"><span>${tn(0)}: <b>${M.sc[0].pts}</b> نقطة</span><span>${tn(1)}: <b>${M.sc[1].pts}</b> نقطة</span></div>`;
    ov=`<div class="veil"><div class="card center">${o.tie?`<h2 class="big">تعادل تام</h2><p>${o.reason}. يحسم المقدّم النتيجة بسؤال فاصل أو بالقرعة.</p>${sum}<div class="row"><button class="btn gold" data-act="commit" data-side="0">فوز ${tn(0)}</button><button class="btn gold" data-act="commit" data-side="1">فوز ${tn(1)}</button></div>`
      :`${emb(T(o.win),'xl')}<h2 class="big">فاز قسم ${tn(o.win)}</h2><p>${o.reason}.</p>${sum}<div class="row"><button class="btn gold" data-act="commit">اعتماد النتيجة</button>${M.undo.length?`<button class="btn" data-act="undo">تراجع عن آخر دور</button>`:''}</div>`}</div></div>`}
  else if(U.q){const Q=U.q,w=M.words.find(x=>x.id===Q.id),pat=Q.fix.map((f,i)=>f?`<span class="fix">${f}</span>`:Q.done?`<span>${Q.ok?w.a[i]:(Q.fill[i]!=null?Q.tiles[Q.fill[i]]:'')}</span>`:`<button class="slot ${Q.fill[i]!=null?'full':''}" data-act="slot" data-i="${i}" aria-label="الخانة ${i+1}">${Q.fill[i]!=null?Q.tiles[Q.fill[i]]:''}</button>`).join('');let body;
    if(Q.done)body=`<div class="qres"><span class="${Q.ok?'good':'fail'}">${Q.ok?`إجابة صحيحة. ${Q.gain} نقطة لقسم ${tn(M.turn)}.`:(Q.typed==null?'انتهى الوقت. ':'إجابة خاطئة. ')+'يُكشف حرف وينتقل الدور.'}</span><button class="btn gold" data-act="cont" id="contbtn">متابعة</button></div>`;
    else body=`<div class="tiles">${Q.tiles.map((ch,k)=>`<button class="tile" data-act="tile" data-i="${k}" ${Q.fill.includes(k)?'disabled':''}>${ch}</button>`).join('')}</div><div class="ansrow"><span class="cat">اضغط الحروف بالترتيب. اضغط خانة مملوءة لإفراغها.</span><button class="btn" data-act="clr">مسح</button><button class="btn gold" data-act="submit" ${qFull(Q)?'':'disabled'}>تأكيد الإجابة</button></div>`;
    ov=`<div class="veil"><div class="card"><div class="qhead">${emb(T(M.turn))}<span class="nm">${tn(M.turn)}</span>${S.cfg.rot?`<span class="cat">المجيب: ${mem(M.turn)}</span>`:''}<span class="badge l${(w.l||2)-1}">${LV[w.l||2]}</span><span class="badge">${w.num} ${w.d?'عمودي':'أفقي'}</span><span class="cat">${CATS[w.cat]||esc(w.cat)}</span><span class="cat">${nL(w.a.length)}</span><span class="qtime" id="qtime">${Math.ceil(Q.left)}</span></div><div class="qbar"><i id="qfill"></i></div><h2 class="qtext">${esc(w.clue)}</h2><div class="pat">${pat}</div>${body}</div></div>`}
  return `<div class="sbrow">${sb(0)}<div class="mid"><small>${RN(M.i)}</small>${S.cfg.mTime>0?`<div class="clock" id="mclock">${fmt(M.left)}</div>`:''}</div>${sb(1)}</div>
<div class="status">${st}</div>
<div class="play"><div class="frame"><div class="cw" style="--cs:calc(var(--bs)/${Math.max(M.R,M.C)});grid-template-columns:repeat(${M.C},var(--cs))">${bd}</div></div>
<div class="clues">${col(0)}${col(1)}</div></div>
<div class="mctl"><button class="btn sm" data-act="pass">تخطّي الدور</button><button class="btn sm" data-act="pause">إيقاف مؤقت</button><button class="btn sm" data-act="undo" ${M.undo.length?'':'disabled'}>تراجع عن آخر دور</button><button class="btn sm" data-act="endnow">إنهاء واحتساب النقاط</button></div>${ov}`}

function bankList(){const qs=bank().filter(q=>(!U.fl||(q.l||2)===+U.fl)&&(!U.fc||q.c===U.fc)&&(!U.fs||q.q.includes(U.fs)||q.w.includes(U.fs)));
  return qs.length?qs.map(q=>`<li><div class="bq"><span class="badge l${(q.l||2)-1}">${LV[q.l||2]}</span> <span class="cat">${CATS[q.c]||esc(q.c)}</span><p>${esc(q.w)}</p><small>${esc(q.q)}</small></div><div class="bact"><button class="btn sm" data-act="qedit" data-id="${q.id}">تعديل</button><button class="btn sm" data-act="qdel" data-id="${q.id}">حذف</button></div></li>`).join(''):'<li class="empty">لا توجد كلمات مطابقة.</li>'}
function vBank(){const all=bank(),e=U.edit?(all.find(q=>q.id===U.edit)||{c:'gn',w:'',q:'',l:2}):null,lvsel=(id,f,v,any)=>`<select id="${id}" ${f?`data-f="${f}"`:''}>${any?`<option value="">${any}</option>`:''}${[1,2,3].map(l=>`<option value="${l}" ${+v===l?'selected':''}>${LV[l]}</option>`).join('')}</select>`,nl=l=>all.filter(q=>(q.l||2)===l).length,ct=Object.entries(CATS);
  const sel=(id,f,v,any)=>`<select id="${id}" ${f?`data-f="${f}"`:''}>${any?`<option value="">${any}</option>`:''}${ct.map(([k,t])=>`<option value="${k}" ${v===k?'selected':''}>${t}</option>`).join('')}</select>`;
  return `<div class="pagehead"><h2>بنك الكلمات</h2><div class="row"><button class="btn gold" data-act="qnew">إضافة كلمة</button>${S.ws?`<button class="btn" data-act="qreset">استعادة الكلمات الأصلية</button>`:''}</div></div>
<p class="lead">عدد الكلمات: ${all.length}. سهل ${nl(1)} · متوسط ${nl(2)} · صعب ${nl(3)}. تعديل البنك لا يغيّر النماذج المولَّدة. ولّد نموذجاً بديلاً من شاشة «النماذج» إن أردت.</p>
${e?`<div class="box"><h3>${U.edit==='new'?'كلمة جديدة':'تعديل الكلمة'}</h3><div class="bform"><div class="field"><label for="bq-a">الكلمة (من حرفين إلى عشرة، بلا فراغات)</label><input type="text" id="bq-a" value="${esc(e.w)}"></div><div class="field"><label for="bq-c">النوع</label>${sel('bq-c','',e.c)}</div><div class="field"><label for="bq-l">المستوى</label>${lvsel('bq-l','',e.l||2)}</div><div class="field wide"><label for="bq-text">التعريف الذي يظهر للمتسابقين</label><textarea id="bq-text" rows="2">${esc(e.q)}</textarea></div></div>
<div class="row" style="justify-content:flex-start"><button class="btn gold" data-act="qsave">حفظ الكلمة</button><button class="btn" data-act="qcancel">إلغاء</button><span class="empty" id="bq-msg"></span></div></div>`:''}
<div class="filters">${lvsel('ffl','fl',U.fl,'كل المستويات')}${sel('ffc','fc',U.fc,'كل الأنواع')}<input type="search" id="bs" placeholder="ابحث في الكلمات والتعريفات" value="${esc(U.fs)}" aria-label="بحث"></div>
<ul class="blist" id="blist">${bankList()}</ul>`}

function vChamp(){const t=S.teams[S.br[6].w];return `<div class="champ"><div class="crown">♛︎</div>${emb(t,'xl')}<p>بطل مسابقة تقاطع المعرفة</p><h2>قسم ${esc(t.name)}</h2><p>كلية الإدارة والاقتصاد · جامعة الموصل</p><div class="row"><button class="btn" data-act="go" data-scr="bracket">شجرة البطولة</button><button class="btn" data-act="party">احتفال</button></div></div>`}

function confetti(){const c=$('#fx');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const g=c.getContext('2d'),cols=['#dcaa45','#f4ecd6','#63c98a','#f3cf7a',S.teams[S.br[6].w].color];
  const P=Array.from({length:170},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*8,a:Math.random()*6,c:cols[Math.random()*cols.length|0]}));let n=0;
  (function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.08;p.x+=Math.sin(p.a)*1.5;if(p.y>c.height)p.y=-10;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s*.55)});
    if(++n<700&&S.scr==='champ')requestAnimationFrame(f);else{g.clearRect(0,0,c.width,c.height);c.hidden=true}})()}

let armed=null;
function sure(btn,key){if(armed===key){armed=null;return true}armed=key;const old=btn.textContent;btn.textContent='اضغط ثانية للتأكيد';btn.classList.add('arm');
  setTimeout(()=>{if(armed===key){armed=null;btn.textContent=old;btn.classList.remove('arm')}},3000);return false}
const ownWs=()=>{if(!S.ws)S.ws=DEFW.map(q=>({...q}));return S.ws};
document.addEventListener('click',e=>{const cl=e.target.closest('[data-r]');if(cl){clickCell(+cl.dataset.r,+cl.dataset.c);return}
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,M=S.cur;
  switch(d.act){
    case'go':S.scr=d.scr;U.edit=null;save();render();break;
    case'mute':S.mute=!S.mute;save();render();break;
    case'full':{const el=document.documentElement;try{(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()).catch(()=>{})}catch(x){}break}
    case'draw':drawLots();S.scr='bracket';save();render();break;
    case'redraw':if(sure(b,'redraw')){drawLots();S.scr='bracket';save();render()}break;
    case'bg':S.bg=d.c;save();render();break;
    case'rmlogo':S.logos[d.k]='';save();render();break;
    case'start':startMatch(+d.i);break;
    case'pk':{const o=+d.k,P=U.pk;P.sel[o]=P.sel[o]===d.c?null:d.c;if(P.sel[o]&&P.sel[1-o]===P.sel[o]&&freshN(d.c)<2*S.cfg.k)P.sel[o]=null;P.msg='';render();break}
    case'begin':beginMatch();break;
    case'pause':if(M&&!M.over){U.paused=!U.paused;render();}break;
    case'undo':undoMove();break;
    case'pass':passTurn();break;
    case'life':lifeline();break;
    case'endnow':if(M&&!M.over&&!U.q&&sure(b,'end')){U.sel=null;decide('أنهى المقدّم المباراة');save();render()}break;
    case'pick':if(M&&!M.over&&!U.q){const w=M.words.find(x=>x.id===d.id);if(w&&w.o===M.turn&&w.by==null){U.sel=d.id;snd('tap');render()}}break;
    case'ask':ask();break;
    case'submit':if(U.q&&qFull(U.q))answer(qWord(U.q));break;
    case'tile':tileClick(+d.i);break;
    case'slot':slotClick(+d.i);break;
    case'clr':if(U.q&&!U.q.done){U.q.fill=U.q.fill.map(()=>null);render()}break;
    case'cont':cont();break;
    case'commit':commit(d.side);break;
    case'party':confetti();snd('win');break;
    case'qnew':U.edit='new';render();$('#bq-a').focus();break;
    case'qedit':U.edit=d.id;render();$('#bq-a').focus();break;
    case'qcancel':U.edit=null;render();break;
    case'qdel':if(sure(b,'del'+d.id)){S.ws=ownWs().filter(q=>q.id!==d.id);save();render()}break;
    case'qreset':if(sure(b,'reset')){S.ws=null;save();render()}break;
    case'qsave':{const w=$('#bq-a').value.trim(),q=$('#bq-text').value.trim(),a=norm(w);
      if(!/^[ء-ي]{2,10}$/.test(a)){$('#bq-msg').textContent='الكلمة يجب أن تكون حروفاً عربية فقط، من حرفين إلى عشرة.';break}
      if(!q){$('#bq-msg').textContent='اكتب تعريف الكلمة.';break}
      const ws=ownWs();if(ws.some(x=>x.id!==U.edit&&norm(x.w)===a)){$('#bq-msg').textContent='هذه الكلمة موجودة في البنك.';break}
      const rec={c:$('#bq-c').value,l:+$('#bq-l').value,w,q},ix=ws.findIndex(x=>x.id===U.edit);
      if(ix>=0)ws[ix]={...rec,id:U.edit};else ws.unshift({...rec,id:'u'+Date.now()});
      U.edit=null;save();render();break}
  }});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;if(!f)return;
  if(f==='logo'){const file=el.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logos[el.dataset.k]=c.toDataURL('image/png');save();render()};im.src=rd.result};rd.readAsDataURL(file);return}
  if(f==='qTime')S.cfg.qTime=Math.min(180,Math.max(5,+el.value||30));
  else if(f==='k')S.cfg.k=Math.min(10,Math.max(3,+el.value||10));
  else if(f==='pickTime')S.cfg.pickTime=Math.min(120,Math.max(0,+el.value||0));
  else if(f==='mTime')S.cfg.mTime=Math.min(60,Math.max(0,+el.value||0));
  else if(f==='minLv')S.cfg.minLv=+el.value;
  else if(f==='rot')S.cfg.rot=el.checked;
  else if(f==='m'){const t=S.teams[el.dataset.i];t.m=t.m||['','',''];t.m[el.dataset.j]=el.value.trim()}
  else if(f==='fl')U.fl=el.value;
  else if(f==='bg')S.bg=el.value;
  else if(f==='fc')U.fc=el.value;
  else S.teams[el.dataset.i][f]=f==='name'?(el.value.trim()||'قسم '+(+el.dataset.i+1)):el.value;
  save();if(!['name','m','qTime','pickTime','mTime','k'].includes(f))render()});
document.addEventListener('input',e=>{if(e.target.id==='bs'){U.fs=e.target.value.trim();$('#blist').innerHTML=bankList()}});
document.addEventListener('keydown',e=>{if(S.scr!=='match'||e.key!=='Enter')return;
  if(U.q&&!U.q.done){if(qFull(U.q)){e.preventDefault();answer(qWord(U.q))}}
  else if(U.q&&U.q.done){e.preventDefault();cont()}});
render();
</script>
</body>
